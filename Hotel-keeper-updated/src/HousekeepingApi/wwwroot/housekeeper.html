<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Housekeeping</title><script src="js/theme.js"></script><link rel="stylesheet" href="css/app.css"></head>
<body>
<header class="app-bar" id="appbar"></header>
<main class="wrap" id="main">
<div class="page-head"><div><h1>Housekeeping</h1><p>Work through notices and check room status.</p></div></div>
<section id="summary" class="stats" aria-label="Summary"></section>
<section class="panel"><div class="panel-head"><h2>Housekeeping notices</h2></div><div class="tw"><table class="stack"><thead><tr><th scope="col">Room</th><th scope="col">Message</th><th scope="col" class="hide-sm">Sender</th><th scope="col" class="hide-sm">Date / time</th><th scope="col" class="hide-sm">Assigned</th><th scope="col">Notice</th><th scope="col">Room status</th><th scope="col">Action</th></tr></thead>
<tbody id="nrows"><tr><td colspan="8" class="msg">Loading notices…</td></tr></tbody></table></div></section>
<section class="panel"><div class="panel-head"><h2>Room status and availability</h2><div id="toolbar" class="toolbar"></div></div>
<div class="tw"><table class="stack"><thead><tr><th scope="col">Room</th><th scope="col">Status</th><th scope="col">Availability</th><th scope="col" class="hide-sm">Last updated</th></tr></thead>
<tbody id="rows"><tr><td colspan="4" class="msg">Loading rooms…</td></tr></tbody></table></div></section></main>
<script src="js/config.js"></script><script src="js/common.js"></script>
<script>
requireRole('Housekeeper');
let rooms = [], notices = [];
const NEXT = { Pending: ['Acknowledged', 'Acknowledge', 'check'], Acknowledged: ['Cleaning', 'Start cleaning', 'play'], Cleaning: ['Completed', 'Mark completed', 'checkCircle'] };
function draw() {
  const l = filtered(rooms), map = Object.fromEntries(rooms.map(r => [r.roomNumber, r.status]));
  $('#rows').innerHTML = l.length ? l.map(r => `<tr><td><b>${esc(r.roomNumber)}</b></td><td>${badge(r.status)}</td><td>${esc(r.availability)}</td><td class="hide-sm">${fmt(r.lastUpdatedAt)}</td></tr>`).join('') : msgRow(4, 'No rooms match your search.');
  $('#nrows').innerHTML = notices.length ? notices.map(n => { const nx = NEXT[n.status]; return `<tr><td><b>${esc(n.roomNumber)}</b></td><td>${esc(n.message)}</td><td class="hide-sm">${esc(n.createdBy)}</td><td class="hide-sm">${fmt(n.createdAt)}</td><td class="hide-sm">${esc(n.assignedTo || '—')}</td><td>${badge(n.status)}</td>
    <td>${map[n.roomNumber] ? badge(map[n.roomNumber]) : '—'}</td><td>${nx ? btn(nx[1], nx[2], { data: { id: n.id, s: nx[0] }, cls: 'primary' }) : (n.status === 'Completed' ? 'Done' : '—')}</td></tr>`; }).join('') : msgRow(8, 'No housekeeping notices.');
}
$('#nrows').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return; const n = notices.find(x => x.id == b.dataset.id);
  try {
    await api(`/notices/${b.dataset.id}/status`, { method: 'PATCH', body: { status: b.dataset.s, expectedVersion: n?.version } });
    toast(b.dataset.s === 'Completed' ? 'Notice completed. The room stays "Cleaning" until a Room Assistant confirms it is ready.' : 'Notice updated.'); load();
  } catch (x) { toast(x.message, true); load(); }
};
async function load() {
  try { const [r, n] = await Promise.all([api('/rooms'), api('/notices?pageSize=100')]); rooms = r.map(normRoom); notices = n.items.map(normNotice); }
  catch (x) { $('#nrows').innerHTML = msgRow(8, x.message, true); return; }
  summary(rooms); draw();
}
initShell(draw); load(); setInterval(load, 15000);
</script></body></html>
